[package]
name = "strongroom-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Stable C ABI / UniFFI boundary for the Strongroom native apps"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "strongroom_ffi"

[dependencies]
vtf-core = { path = "../vtf-core" }
vault-core = { path = "../vault-core" }
uniffi = "=0.32.2"
zeroize = "1.8"

[dev-dependencies]
# Test oracle only: software P-256 device key standing in for secure hardware.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic"] }

[build-dependencies]
uniffi = { version = "=0.32.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
