[package]
name = "vtf-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Vault Transfer Format (VTF) v1: frozen encrypted transfer file format"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
hpke = { version = "0.15", default-features = false, features = ["nistp", "chacha", "getrandom", "alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
unicode-normalization = { version = "0.1", default-features = false }

[lints.rust]
# `cfg(fuzzing)` is set by cargo-fuzz (fuzz/); it gates one doc(hidden) hook.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
# Test oracles only; never linked into shipped code.
# p256: software ECDH to drive the hardware-ECDH HPKE receive path in tests.
# ciborium: independent CBOR decoder to cross-check the strict encoder.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic"] }
ciborium = "0.2"
