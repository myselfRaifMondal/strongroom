# Weekly dependency update PRs. Security-core crates still need a human
# review against CONTRIBUTING.md before merging.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Pinned to match uniffi-bindgen-cs (Windows C# bindings); see OQ-8.
      - dependency-name: "uniffi*"
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /apps/android
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # Newer androidx.core needs compileSdk 37 and AGP 9.1 (PR #11). Upgrade
      # those together on purpose, then remove this rule.
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /apps/windows
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /reference
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
