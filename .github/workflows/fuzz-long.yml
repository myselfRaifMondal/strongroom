# Long fuzzing: runs each cargo-fuzz target for a set time (default 1 hour),
# keeps the corpus between runs in the Actions cache, minimises it with
# `cargo fuzz cmin`, and fails the job if any input crashes.
# The 60-second smoke runs on every pull request stay in rust.yml; this
# workflow runs on a pull request only when it, fuzz/minimise.sh or the
# pinned nightly (fuzz/rust-toolchain.toml) changes.
#
# Crash inputs are uploaded as a run artifact. This repo is public, so
# anyone signed in to GitHub can download run artifacts, and anyone can read
# the logs, where libFuzzer also prints small crashing inputs as Base64.
# Treat a crash as a possible vulnerability: a maintainer should download the
# input, report it privately as docs/SECURITY.md says, then delete the run's
# artifact.
name: fuzz-long

on:
  schedule:
    - cron: "17 3 * * 0" # weekly, Sunday 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Run time per target, in seconds (max 18000)"
        required: false
        default: "3600"
  # A short run when this workflow or the minimise script changes, so the
  # pipeline itself is tested before it reaches main.
  pull_request:
    paths:
      - ".github/workflows/fuzz-long.yml"
      - "fuzz/minimise.sh"
      - "fuzz/rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: fuzz-long-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The prebuilt cargo-fuzz is a musl binary and would default to its own
  # triple (ASan cannot link static musl), so name the target.
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - container_parse
          - chunk_decrypt
          - payload_decode
          - csv_import
          - pairing_parse
          - totp_uri
          - vault_header
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run time
        id: time
        env:
          SECONDS_IN: ${{ inputs.seconds || (github.event_name == 'pull_request' && '60' || '3600') }}
        run: |
          if ! [[ "$SECONDS_IN" =~ ^[0-9]+$ ]] || [ "$SECONDS_IN" -lt 1 ] || [ "$SECONDS_IN" -gt 18000 ]; then
            echo "::error::seconds must be a whole number from 1 to 18000"
            exit 1
          fi
          echo "seconds=$SECONDS_IN" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (dated nightly from fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz
      - name: restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: add seeds from vectors/
        run: fuzz/seed_corpus.sh
      - name: cargo fuzz run (${{ steps.time.outputs.seconds }} s)
        working-directory: fuzz
        # libFuzzer exits non-zero on a crash, leak, timeout or OOM, which
        # fails this step and the job.
        run: >-
          cargo fuzz run --target "$FUZZ_TRIPLE"
          ${{ matrix.target }} corpus/${{ matrix.target }} --
          -max_total_time=${{ steps.time.outputs.seconds }}
          -rss_limit_mb=2048 -print_final_stats=1
      - name: minimise corpus
        run: fuzz/minimise.sh ${{ matrix.target }}
      - name: corpus size
        if: always()
        run: |
          n="$(ls fuzz/corpus/${{ matrix.target }} 2>/dev/null | wc -l | tr -d ' ')"
          echo "${{ matrix.target }}: ${{ steps.time.outputs.seconds }} s, corpus $n inputs" >> "$GITHUB_STEP_SUMMARY"
      - name: save corpus
        if: always() && hashFiles(format('fuzz/corpus/{0}/**', matrix.target)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-long-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
