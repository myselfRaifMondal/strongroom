# Rust core assurance: lint, tests (incl. the VTF1 vector suite), the
# independent Python reference, fuzz smoke, dependency audit, and
# cross-compilation of the Rust crates for every shipping target.
# Platform app builds live in their own workflows (android.yml, windows.yml,
# apple.yml) and are not duplicated here.
name: rust

on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml, with rustfmt + clippy)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt --check
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      # uniffi's generated scaffolding trips clippy::large_const_arrays; the
      # allow for it sits on the scaffolding module in strongroom-ffi/src/lib.rs.
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test (includes the VTF1 vector suite and property tests)
        run: cargo test --workspace --locked

  reference:
    name: python reference vs vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: reference unit tests and KATs
        working-directory: reference
        run: uv run --locked --group dev pytest -q
      - name: verify every vector (sequential; Argon2id 256 MiB per derivation)
        working-directory: reference
        run: uv run --locked python -m vtf_ref.verify vectors/ --strict

  fuzz:
    name: fuzz smoke (${{ matrix.target }}, 60 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - container_parse
          - chunk_decrypt
          - payload_decode
          - csv_import
          - pairing_parse
          - totp_uri
          - vault_header
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (dated nightly from fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz
      - name: seed corpus from vectors/
        run: fuzz/seed_corpus.sh
      - name: cargo fuzz run
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to its
        # own triple (ASan cannot link static musl), so name the target.
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu
          ${{ matrix.target }} corpus/${{ matrix.target }} --
          -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-audit
      # Vulnerabilities, unsound and yanked crates fail the build;
      # "unmaintained" notices are printed but do not fail it (currently
      # basic-toml via uniffi's build-time tooling, RUSTSEC-2026-0374).
      - name: audit workspace lockfile
        run: cargo audit --deny unsound --deny yanked --file Cargo.lock
      - name: audit fuzz lockfile
        run: cargo audit --deny unsound --deny yanked --file fuzz/Cargo.lock

  cross-apple:
    name: build ${{ matrix.target }}
    runs-on: macos-latest
    env:
      # Without an explicit target rustc links iOS for 10.0, which lacks
      # ___chkstk_darwin used by the bundled SQLCipher and OpenSSL C code.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}

  cross-android:
    name: build android (cargo-ndk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-ndk
      - name: cargo ndk build (arm64-v8a, x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 build --workspace --locked

  cross-windows:
    name: build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}
