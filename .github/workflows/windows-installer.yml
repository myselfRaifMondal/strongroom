# Windows installers (Inno Setup) for x64 and ARM64, plus portable zips.
#
# Output: one workflow artifact, `strongroom-windows-installers` (30 days):
#   Strongroom-Setup-<ver>-x64.exe, Strongroom-Setup-<ver>-arm64.exe,
#   Strongroom-<ver>-x64-portable.zip, Strongroom-<ver>-arm64-portable.zip,
#   SHA256SUMS.txt
#
# Nothing is published here. release.yml calls this workflow on a v* tag and
# attaches the files to a draft GitHub Release (docs/RELEASING.md).
#
# Signing (#27): when the Azure Trusted Signing secrets and variables exist,
# Strongroom's own .exe/.dll files and both installers are Authenticode-
# signed. Without them (forks, pull requests) everything is built unsigned.
#
# Everything is self-contained (.NET 8, Windows App SDK, static MSVC CRT in
# strongroom_ffi.dll), so a fresh Windows 10 1809+/11 PC needs nothing else.
name: windows-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0 or 0.2.0-beta.1)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Version (e.g. 0.1.0 or 0.2.0-beta.1)"
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: "Version the files are named with"
        value: ${{ jobs.version.outputs.version }}
      signed:
        description: "'true' when the binaries and installers were signed"
        value: ${{ jobs.package.outputs.signed }}
  push:
    branches: ["feature/windows-installer"]

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this file, so
  # a release run and a manual run do not cancel each other.
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_CS_TAG: "v0.11.1+v0.31.0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="0.1.0"
          if [ "$REF_TYPE" = "tag" ]; then v="${REF_NAME#v}"; fi
          if [ -n "${INPUT_VERSION:-}" ]; then v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid version '$v' (want MAJOR.MINOR.PATCH[-pre])"; exit 1
          fi
          n="${v%%-*}.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$n" >> "$GITHUB_OUTPUT"
          echo "version $v (file version $n)"

  native:
    name: strongroom_ffi.dll ${{ matrix.rid }} (static CRT)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            rid: win-x64
          - target: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-crt-static-${{ matrix.target }}
      - name: Build DLL with the static MSVC runtime
        shell: pwsh
        run: apps/windows/scripts/build-native.ps1 -Target ${{ matrix.target }} -StaticCrt
      - name: No Visual C++ runtime import
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "**\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dll = "apps/windows/native/${{ matrix.rid }}/strongroom_ffi.dll"
          $deps = & $dumpbin /nologo /dependents $dll | ForEach-Object { "$_".Trim() } | Where-Object { $_ -match '\.dll$' }
          "strongroom_ffi.dll (${{ matrix.rid }}) imports:"; $deps | ForEach-Object { "  $_" }
          $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|vcomp|concrt)\d' }
          if ($crt) { "::error::strongroom_ffi.dll still imports the VC++ runtime: $($crt -join ', ')"; exit 1 }
          "OK: strongroom_ffi.dll does not need the Visual C++ Redistributable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-native-${{ matrix.rid }}
          path: apps/windows/native/${{ matrix.rid }}/strongroom_ffi.dll
          retention-days: 1
          if-no-files-found: error

  bindings:
    name: C# bindings
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache uniffi-bindgen-cs
        id: cache-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-windows
      - name: Rust toolchain (rust-toolchain.toml)
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - name: Install uniffi-bindgen-cs
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "${{ env.UNIFFI_BINDGEN_CS_TAG }}" --locked
      - name: Generate
        shell: pwsh
        run: apps/windows/scripts/gen-bindings.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-bindings-cs
          path: apps/windows/src/Strongroom.Core/Generated/strongroom.cs
          retention-days: 1
          if-no-files-found: error

  package:
    name: package ${{ matrix.arch }}
    needs: [version, native, bindings]
    runs-on: windows-latest
    permissions:
      contents: read
      # Azure login with OpenID Connect (no stored password). Only used when
      # signing is configured.
      id-token: write
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            platform: x64
          - arch: arm64
            rid: win-arm64
            platform: ARM64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_NUMERIC: ${{ needs.version.outputs.numeric }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-native-${{ matrix.rid }}
          path: apps/windows/native/${{ matrix.rid }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-bindings-cs
          path: apps/windows/src/Strongroom.Core/Generated

      - name: App icon (.ico from the shared 1024 px PNG)
        shell: powershell
        run: apps/windows/installer/make-icon.ps1

      - name: Publish CLI + app (self-contained ${{ matrix.rid }})
        shell: pwsh
        run: |
          $out = "apps/windows/out/publish-${{ matrix.arch }}"
          # CLI first, then the app on top: where the two share a file (the
          # .NET runtime, Strongroom.Core.dll, CsWinRT), the app's copy wins.
          dotnet publish apps/windows/src/Strongroom.Cli/Strongroom.Cli.csproj -c Release `
            -r ${{ matrix.rid }} --self-contained true -p:StrongroomNativeRid=${{ matrix.rid }} `
            -p:Version=$env:VERSION -p:FileVersion=$env:VERSION_NUMERIC -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish apps/windows/src/Strongroom.App/Strongroom.App.csproj -c Release `
            -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:StrongroomNativeRid=${{ matrix.rid }} `
            -p:Version=$env:VERSION -p:FileVersion=$env:VERSION_NUMERIC -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Debug symbols are not shipped.
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item
          foreach ($f in "Strongroom.exe", "strongroom-cli.exe", "strongroom_ffi.dll", "Strongroom.ico", "Microsoft.WindowsAppRuntime.dll") {
            if (-not (Test-Path (Join-Path $out $f))) { "::error::publish output lacks $f"; exit 1 }
          }
          $files = Get-ChildItem $out -Recurse -File
          "publish output: $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MB"
          (Get-Item (Join-Path $out "Strongroom.exe")).VersionInfo | Format-List FileVersion, ProductVersion

      - name: Dependency check (whole output folder)
        shell: pwsh
        run: apps/windows/installer/check-deps.ps1 -Dir apps/windows/out/publish-${{ matrix.arch }} -Machine ${{ matrix.arch }}

      # Code signing (#27). Runs only when every value below is set; the step
      # prints only "enabled"/"disabled", never a value. Secrets cannot be
      # used in `if:` directly, hence this check. Pull requests never sign:
      # same-repo PRs receive repository secrets. In a called workflow
      # github.event_name is the caller's event, so this covers release.yml.
      - name: Signing configured?
        id: signing
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (pull request), building unsigned"
          elif [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] \
             && [ -n "$SIGNING_ENDPOINT" ] && [ -n "$SIGNING_ACCOUNT" ] && [ -n "$SIGNING_PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "signing: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (secrets/variables not set), building unsigned"
          fi

      - name: Azure login (OIDC)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries (Azure Trusted Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          # Only Strongroom's own files; the .NET and Windows App SDK files
          # keep Microsoft's signatures.
          files: |
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\Strongroom.exe
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\Strongroom.dll
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\strongroom-cli.exe
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\strongroom-cli.dll
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\Strongroom.Core.dll
            ${{ github.workspace }}\apps\windows\out\publish-${{ matrix.arch }}\strongroom_ffi.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { "::error::ISCC.exe not found"; exit 1 }
          "ISCC: $iscc ($((Get-Item $iscc).VersionInfo.ProductVersion))"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer + portable zip
        shell: pwsh
        run: |
          $src = (Resolve-Path "apps/windows/out/publish-${{ matrix.arch }}").Path
          $dist = Join-Path $PWD "apps/windows/installer/out"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $ico = (Resolve-Path "apps/windows/src/Strongroom.App/Assets/Strongroom.ico").Path
          & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/DAppVersionNumeric=$env:VERSION_NUMERIC" "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$src" "/DIconFile=$ico" "/DOutputDir=$dist" apps/windows/installer/Strongroom.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Portable zip: the same files in a top-level Strongroom folder.
          $stage = Join-Path $env:RUNNER_TEMP "portable/Strongroom"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$src/*" $stage -Recurse -Force
          Set-Content (Join-Path $stage "README-PORTABLE.txt") -Encoding utf8 -Value @(
            "Strongroom $env:VERSION (${{ matrix.arch }}), portable copy.",
            "",
            "1. Right-click the downloaded .zip, choose Properties, tick 'Unblock', click OK.",
            "2. Extract it somewhere you can write to, e.g. your Documents folder.",
            "3. Double-click Strongroom.exe.",
            "",
            "Your vault is stored in %LOCALAPPDATA%\Strongroom, not in this folder.",
            "Deleting this folder does not delete your vault.",
            "Full guide: https://github.com/myselfRaifMondal/strongroom/blob/main/apps/windows/INSTALL.md")
          $zip = Join-Path $dist "Strongroom-$env:VERSION-${{ matrix.arch }}-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-ChildItem $dist | Format-Table Name, Length

      # The portable zip was made from the signed publish folder above. The
      # uninstaller inside the installer stays unsigned (Inno Setup's
      # SignTool= needs a local signer; see docs/RELEASING.md).
      - name: Sign installer (Azure Trusted Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\windows\installer\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true

      - name: Check signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/windows/installer/out -Filter *.exe) +
                   @(Get-Item "apps/windows/out/publish-${{ matrix.arch }}/Strongroom.exe",
                              "apps/windows/out/publish-${{ matrix.arch }}/strongroom-cli.exe",
                              "apps/windows/out/publish-${{ matrix.arch }}/strongroom_ffi.dll")
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { "::error::$bad file(s) without a valid signature"; exit 1 }

      - name: Microsoft Defender scan of the installer (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { "Defender command line not present on this runner"; exit 0 }
          try { Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion } catch { "Get-MpComputerStatus: $($_.Exception.Message)" }
          Get-ChildItem apps/windows/installer/out -File | ForEach-Object {
            "--- $($_.Name)"
            & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation
            "MpCmdRun exit code: $LASTEXITCODE (0 = no threat found, 2 = threat found)"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.arch }}
          path: apps/windows/installer/out/*
          retention-days: 3
          if-no-files-found: error

  smoke-x64:
    name: smoke test x64 (windows-latest)
    needs: [version, package]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/windows/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pkg-x64
          path: dist
      - name: install -> launch -> CLI round-trip -> uninstall -> data kept
        shell: pwsh
        run: apps/windows/installer/smoke-test.ps1 -Installer "dist/Strongroom-Setup-${{ needs.version.outputs.version }}-x64.exe"

  smoke-arm64:
    # GitHub's hosted Windows 11 ARM64 runner (free for public repositories).
    name: smoke test arm64 (windows-11-arm)
    needs: [version, package]
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/windows/installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pkg-arm64
          path: dist
      - name: install -> launch -> CLI round-trip -> uninstall -> data kept
        shell: pwsh
        run: apps/windows/installer/smoke-test.ps1 -Installer "dist/Strongroom-Setup-${{ needs.version.outputs.version }}-arm64.exe"

  collect:
    name: collect installers + SHA256SUMS
    needs: [version, package, smoke-x64, smoke-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum Strongroom-* | tee SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strongroom-windows-installers
          path: dist/
          retention-days: 30
          if-no-files-found: error
