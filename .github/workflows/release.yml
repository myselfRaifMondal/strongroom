# Release: builds every download and creates a DRAFT GitHub Release.
#
#   push of a v* tag   -> build, sign where configured, SHA256SUMS.txt,
#                         draft pre-release with all files (never published:
#                         the maintainer reviews and publishes it by hand)
#   workflow_dispatch  -> dry run: the same build, files kept as a workflow
#                         artifact, no tag and no release
#   pull_request       -> the same dry run, when a release workflow changes
#
# Files: Windows installers + portable zips (x64, ARM64, via
# windows-installer.yml), Android release APK (arm64-v8a), macOS app zip,
# SHA256SUMS.txt. Files that were not signed carry "-unsigned" in their name.
#
# Signing runs only when its secrets exist; nothing here prints a secret.
# Secret and variable names: docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run file names (no release is created)"
        required: false
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"; publish=true
          else
            v="${INPUT_VERSION:-0.1.0}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid version '$v' (want MAJOR.MINOR.PATCH[-pre])"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v, create draft release: $publish"

  windows:
    needs: version
    uses: ./.github/workflows/windows-installer.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  android:
    name: Android release APK (arm64-v8a)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: "27.2.12479018"
      CARGO_NDK_VERSION: "4.1.2"
      STRONGROOM_ABIS: "arm64-v8a"
      STRONGROOM_RUST_PROFILE: "release"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust Android target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "${CARGO_NDK_VERSION}"; then
            cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"
          fi

      - name: Build libstrongroom_ffi.so (release) + Kotlin bindings
        run: apps/android/scripts/build-rust.sh

      - uses: gradle/actions/setup-gradle@v6

      # Prints only "enabled"/"disabled". Secrets cannot be used in `if:`.
      # Pull requests never sign: same-repo PRs receive repository secrets.
      - name: Signing configured?
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          KEYSTORE_B64: ${{ secrets.STRONGROOM_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STRONGROOM_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (pull request), building unsigned"
          elif [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "signing: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (secrets not set), building unsigned"
          fi

      # build.gradle.kts reads STRONGROOM_ANDROID_KEYSTORE* from the
      # environment. They are exported only inside this step, and only when
      # set, so an unset alias keeps the "strongroom" default. Pull requests
      # do not get the secrets in this step at all.
      - name: Gradle assembleRelease
        working-directory: apps/android
        env:
          SIGN: ${{ steps.signing.outputs.enabled }}
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.STRONGROOM_ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.STRONGROOM_ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.STRONGROOM_ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.STRONGROOM_ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$SIGN" = "true" ]; then
            ks="$RUNNER_TEMP/release.jks"
            (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks")
            trap 'rm -f "$ks"' EXIT
            export STRONGROOM_ANDROID_KEYSTORE="$ks"
            export STRONGROOM_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            if [ -n "$KEY_ALIAS" ]; then export STRONGROOM_ANDROID_KEY_ALIAS="$KEY_ALIAS"; fi
            if [ -n "$KEY_PASSWORD" ]; then export STRONGROOM_ANDROID_KEY_PASSWORD="$KEY_PASSWORD"; fi
          fi
          unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          ./gradlew --no-daemon assembleRelease -Pstrongroom.skipRust=true

      - name: Name, check and verify the APK
        env:
          SIGN: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          out=apps/android/app/build/outputs/apk/release
          ls -l "$out"
          mkdir -p dist
          if [ "$SIGN" = "true" ]; then
            apk="$out/app-release.apk"
            name="Strongroom-$VERSION-android-arm64-v8a.apk"
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
            "$apksigner" verify --verbose --print-certs "$apk"
          else
            apk="$out/app-release-unsigned.apk"
            name="Strongroom-$VERSION-android-arm64-v8a-unsigned.apk"
          fi
          apps/android/scripts/check-no-network.sh "$apk"
          cp "$apk" "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  macos:
    name: macOS app zip
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_JOBS: "3"
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: Build Rust core + generate Swift bindings
        run: apps/macos/scripts/build-core.sh

      - name: Assemble Strongroom.app (ad-hoc signed)
        env:
          STRONGROOM_VERSION: ${{ needs.version.outputs.version }}
          STRONGROOM_BUILD: ${{ github.run_number }}
        run: apps/macos/scripts/build-app.sh

      # Prints only "enabled"/"disabled". Secrets cannot be used in `if:`.
      # Pull requests never sign: same-repo PRs receive repository secrets.
      - name: Signing configured?
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (pull request), app stays ad-hoc signed"
          elif [ -n "$P12_B64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$IDENTITY" ] \
             && [ -n "$NOTARY_KEY_B64" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "signing: enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing: disabled (secrets not set), app stays ad-hoc signed"
          fi

      # Developer ID signature in a throwaway keychain on the runner, then
      # notarization with an App Store Connect API key and stapling (#18).
      - name: Developer ID sign, notarize, staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          app=apps/macos/out/Strongroom.app
          kc="$RUNNER_TEMP/strongroom-signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          echo "::add-mask::$kcpw"
          p12="$RUNNER_TEMP/cert.p12"
          p8="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$p12" "$p8" "$RUNNER_TEMP/notarize.zip"; security delete-keychain "$kc" 2>/dev/null || true' EXIT
          (umask 077; printf '%s' "$P12_B64" | base64 -d > "$p12"; printf '%s' "$NOTARY_KEY_B64" | base64 -d > "$p8")

          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          codesign --force --options runtime --timestamp --keychain "$kc" --sign "$IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")"
          echo "notarization status: $status"
          [ "$status" = "Accepted" ] || { echo "::error::notarization was not accepted"; exit 1; }
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Zip the app
        env:
          SIGN: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          name="Strongroom-$VERSION-macos-$arch.zip"
          if [ "$SIGN" != "true" ]; then name="Strongroom-$VERSION-macos-$arch-unsigned.zip"; fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apps/macos/out/Strongroom.app "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  release:
    name: checksums + draft release
    needs: [version, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strongroom-windows-installers
          path: windows
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Collect files + SHA256SUMS.txt
        run: |
          set -euo pipefail
          rm -f windows/SHA256SUMS.txt
          for f in windows/Strongroom-*; do
            name="$(basename "$f")"
            if [ "$WINDOWS_SIGNED" != "true" ]; then
              name="${name%.*}-unsigned.${name##*.}"
            fi
            cp "$f" "dist/$name"
          done
          cd dist
          sha256sum Strongroom-* | tee SHA256SUMS.txt
          ls -l

      - name: Release notes
        run: |
          set -euo pipefail
          signed() { case "$1" in *-unsigned.*) echo "not signed";; *) echo "signed";; esac; }
          win="$(ls dist/Strongroom-Setup-*-x64* | head -n 1)"
          apk="$(ls dist/*-android-* | head -n 1)"
          mac="$(ls dist/*-macos-* | head -n 1)"
          cat > notes.md <<EOF
          **Pre-release software.** Strongroom $VERSION has not had an independent
          security audit. Do not rely on it as your only copy of important passwords.

          ## Downloads

          | Platform | Files | Signature |
          |----------|-------|-----------|
          | Windows 10/11 (x64, ARM64) | installer \`.exe\`, portable \`.zip\` | $(signed "$win") |
          | Android 8+ (arm64-v8a) | \`.apk\` | $(signed "$apk") |
          | macOS 14+ ($(basename "$mac" | sed -E 's/.*-macos-([a-z0-9_]+).*/\1/')) | app \`.zip\` | $(signed "$mac") |

          Files with \`-unsigned\` in the name were built without a signing
          certificate: Windows SmartScreen warns, macOS Gatekeeper blocks the app
          until you allow it, and Android does not install an unsigned APK.

          Check a download against \`SHA256SUMS.txt\`:

              sha256sum -c SHA256SUMS.txt --ignore-missing

          Install guides: [Windows](https://github.com/${{ github.repository }}/blob/main/apps/windows/INSTALL.md),
          [README](https://github.com/${{ github.repository }}#readme).
          EOF
          cp notes.md dist/RELEASE-NOTES.md
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: strongroom-release-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Create DRAFT GitHub Release (tag push only)
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm dist/RELEASE-NOTES.md
          gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
            --title "Strongroom $VERSION (pre-release)" --notes-file notes.md
          echo "Draft release created for $TAG. Review it, then publish it by hand."

      - name: Dry run summary
        if: needs.version.outputs.publish != 'true'
        run: |
          echo "Dry run: no tag, no GitHub Release. Files are in the workflow artifact." | tee -a "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
