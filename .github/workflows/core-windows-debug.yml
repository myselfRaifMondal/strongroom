# TEMPORARY (phase2/core-vault): reproduce and verify the Windows stack
# overflow in vault-core / strongroom-ffi. Delete before the branch is done.
name: core-windows-debug

on:
  push:
    branches: ["phase2/core-vault"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tests:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-fix (ae355f4, expected to overflow)
            ref: ae355f4b5a9bc23e5732301eed623b638269364d
            expect_fail: true
          - label: this commit
            ref: ""
            expect_fail: false
    continue-on-error: ${{ matrix.expect_fail }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p vault-core -p strongroom-ffi --no-run
      - name: decoy_first_matching (vault-core)
        run: cargo test -p vault-core --test vault -- --exact decoy_first_matching --test-threads=1 --nocapture
      - name: vault_round_trip_through_vtf_and_device_unlock (strongroom-ffi)
        if: always()
        run: cargo test -p strongroom-ffi --test ffi -- --exact vault_round_trip_through_vtf_and_device_unlock --test-threads=1 --nocapture
      - name: all vault-core and strongroom-ffi tests
        if: always()
        run: cargo test -p vault-core -p strongroom-ffi -- --test-threads=1
