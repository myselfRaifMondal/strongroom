name: android

on:
  push:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  CARGO_NDK_VERSION: "4.1.2"
  STRONGROOM_ABIS: "arm64-v8a x86_64"
  STRONGROOM_RUST_PROFILE: "debug"
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain (rust-toolchain.toml) + Android targets
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "${CARGO_NDK_VERSION}"; then
            cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"
          fi

      - name: Build libstrongroom_ffi.so + Kotlin bindings
        run: apps/android/scripts/build-rust.sh

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Gradle assembleDebug + unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest assembleDebugAndroidTest -Pstrongroom.skipRust=true

      - name: No network permissions in the APK
        run: apps/android/scripts/check-no-network.sh apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strongroom-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

      - name: Unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: apps/android/app/build/reports/tests/
          retention-days: 7
