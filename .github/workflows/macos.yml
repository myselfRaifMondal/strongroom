# macOS app CI: Rust core -> Swift bindings -> SwiftPM build + tests -> .app
# bundle (ad-hoc signed) -> launch check -> CLI VTF round-trip.
name: macos

on:
  push:
    branches: ["main", "phase2/macos", "phase2/macos-*", "phase3/*", "feature/macos-*"]
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos.yml"
  # Same paths as push: a PR that changes only Cargo.lock (e.g. Dependabot)
  # changes the shipped library, so it must build the app too.
  pull_request:
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_JOBS: "3"

jobs:
  macos:
    name: build, test, app bundle + launch, CLI round-trip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Runner facts
        run: |
          sw_vers
          uname -m
          xcode-select -p
          swift --version
          rustup show active-toolchain || true
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos

      - name: Build Rust core + generate Swift bindings
        run: apps/macos/scripts/build-core.sh

      - name: swift build
        working-directory: apps/macos
        run: swift build

      - name: swift test
        run: apps/macos/scripts/test.sh

      - name: Assemble + ad-hoc sign Strongroom.app
        run: apps/macos/scripts/build-app.sh

      - name: CLI probe (FFI link, Secure Enclave / Touch ID availability)
        run: apps/macos/out/strongroom-mac-cli probe

      - name: CLI round-trip (create, add, export VTF, import, print titles)
        env:
          STRONGROOM_PASSWORD: "ci-throwaway-master-password"
        run: |
          dir="$RUNNER_TEMP/roundtrip"
          set +e
          apps/macos/out/strongroom-mac-cli roundtrip --dir "$dir"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::error title=Core reported Unsupported::strongroom_ffi returned Unsupported during the round-trip; the linked core is missing a feature it should have."
            exit 3
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "--- import of the exported file via 'import --in' (Phase 3 entry point) ---"
          STRONGROOM_SECRET_KEY="$(cat "$dir/source.secret-key.txt")" \
            apps/macos/out/strongroom-mac-cli import --in "$dir/macos-roundtrip.vtf"
          cp "$dir/macos-roundtrip.vtf" apps/macos/out/

      - name: CLI hierarchy round-trip (nested folders + recovery codes survive export/import)
        env:
          STRONGROOM_PASSWORD: "ci-throwaway-master-password"
        run: |
          apps/macos/out/strongroom-mac-cli hierarchy --dir "$RUNNER_TEMP/hierarchy"
          rm -rf "$RUNNER_TEMP/hierarchy"

      - name: CLI organize demo (Apple Passwords CSV -> organize by service -> ranking -> exact undo)
        env:
          STRONGROOM_PASSWORD: "ci-throwaway-master-password"
        run: |
          apps/macos/out/strongroom-mac-cli organize-demo --dir "$RUNNER_TEMP/organize"
          rm -rf "$RUNNER_TEMP/organize"

      - name: Launch Strongroom.app (alive check)
        run: |
          data="$RUNNER_TEMP/app-data"
          mkdir -p "$data"
          STRONGROOM_DATA_DIR="$data" STRONGROOM_SMOKE_OVERLAY=1 \
            apps/macos/out/Strongroom.app/Contents/MacOS/Strongroom > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; code=$?
            echo "APP EXITED EARLY with code $code"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          echo "APP ALIVE after 10 s: pid=$pid"
          ps -o pid,rss,etime,command -p "$pid"
          ls -la "$data"
          echo "--- capture exclusion (main window + quick-access overlay) ---"
          swift apps/macos/scripts/window-sharing.swift "$pid" || { kill "$pid"; exit 1; }
          screencapture -x apps/macos/out/screen-with-app.png \
            && echo "screenshot saved (artifact): the Strongroom windows should be absent from it" \
            || echo "screencapture not permitted on this runner"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "--- app log ---"
          cat "$RUNNER_TEMP/app.log"

      - name: Package artifact
        if: always()
        run: |
          cd apps/macos/out
          [ -d Strongroom.app ] && ditto -c -k --keepParent Strongroom.app Strongroom-macos-adhoc.zip || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: strongroom-macos
          path: |
            apps/macos/out/Strongroom-macos-adhoc.zip
            apps/macos/out/strongroom-mac-cli
            apps/macos/out/*.vtf
            apps/macos/out/*.png
          if-no-files-found: warn
