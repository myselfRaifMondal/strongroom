[project]
name = "vtf-ref"
version = "0.1.0"
description = "Independent Python reference implementation of VTF1 (test/assurance code only, never shipped)"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==46.0.3",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
